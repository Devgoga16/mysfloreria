<!doctype html>
<html lang="es"><head><meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:wght@600&family=Montserrat:wght@500;600;700&display=block" rel="stylesheet" />
<link rel="stylesheet" href="base.css" />
<style>
  .bg { background-image: url("fondo-acuarela.webp"); filter: saturate(1.15); }
  .bg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(246,205,214,.35), rgba(252,236,238,.15) 50%, rgba(246,205,214,.35)); }
  .glow { background: radial-gradient(closest-side, rgba(255,250,251,.92), rgba(255,246,248,.55) 60%, transparent); }
  .photo--left img { object-position: 50% 62%; }
  .photo--right img { object-position: 50% 55%; }
  .logo { color: #c2477a; }
  .logo__div svg { fill: #e0668f; }
  .tagline { color: #8e1d4f; }
  .pill { background: linear-gradient(90deg, #e57a9d, #d9608a); box-shadow: 0 8px 22px -10px rgba(180, 50, 100, .6); }
  .title { color: #8e1d4f; text-shadow: 0 2px 0 rgba(255,255,255,.6); }
  .underline path { stroke: #e0668f; }
  .items { display: flex; gap: 22px; margin-top: 12px; }
  .item { display: flex; align-items: center; gap: 10px; font-size: 27px; font-weight: 600; color: #5a1f3a; }
  .item svg { width: 30px; height: 30px; fill: none; stroke: #d9608a; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .dot { color: #e0668f; font-size: 26px; }
  .foot { color: #8e1d4f; }
</style></head>
<body>
<div class="banner">
  <div class="bg"></div>
  <div class="glow"></div>
  <div class="photo photo--left"><img src="7.jpg" alt="" /></div>
  <div class="photo photo--right"><img src="5.jpg" alt="" /></div>
  <div class="center">
    <div class="logo">
      <span class="logo__word">Florería</span>
      <img src="logo-monograma.png" alt="" />
      <span class="logo__div"><i></i><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.4-7-10.2A3.8 3.8 0 0 1 12 8.6a3.8 3.8 0 0 1 7 2.2C19 16.6 12 21 12 21z"/></svg><i></i></span>
      <span class="logo__word">Detalles</span>
    </div>
    <span class="pill">NUESTROS SERVICIOS</span>
    <h1 class="title">Para cada momento</h1>
    <svg class="underline" viewBox="0 0 640 26" fill="none"><path d="M10 16 C 180 4, 460 4, 630 14" stroke-width="3" stroke-linecap="round"/></svg>
    <div class="items">
      <span class="item"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M12 11v10M12 16c2-2.5 4.5-2.8 6-2.2-.6 2.4-3.2 3.4-6 2.2M12 18c-2-2.2-4.3-2.4-5.6-1.8.6 2.2 3 3 5.6 1.8"/></svg>Ramos</span>
      <span class="dot">♥</span>
      <span class="item"><svg viewBox="0 0 24 24"><path d="M5 10h14l-1.5 10h-11zM8 10c0-3 1.5-6 4-6s4 3 4 6"/></svg>Arreglos florales</span>
      <span class="dot">♥</span>
      <span class="item"><svg viewBox="0 0 24 24"><path d="M4 11h16v9H4zM3 7h18v4H3zM12 7v13M12 7S10.5 3 8 3.8C6 4.5 7 7 9 7M12 7s1.5-4 4-3.2C18 4.5 17 7 15 7"/></svg>Detalles para regalar</span>
    </div>
    <div class="foot"><i></i><span>Delivery en Lima · Pago con Yape y Plin</span><i></i></div>
  </div>
</div>
</body></html>
